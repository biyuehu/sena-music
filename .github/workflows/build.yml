name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - 'music.toml'
      - 'tsconfig.json'
      - 'biome.json'
      - 'uno.config.ts'
      - '.postcssrc.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - 'music.toml'
      - 'tsconfig.json'
      - 'biome.json'
      - 'uno.config.ts'
      - '.postcssrc.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check code
        run: bun run fix && git diff --exit-code

      - name: Build
        run: bun run build